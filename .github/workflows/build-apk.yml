name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, whisper-v6 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Whisper tiny.en model
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin \
            -o app/src/main/assets/models/ggml-tiny.en.bin
          test -s app/src/main/assets/models/ggml-tiny.en.bin
          ls -lh app/src/main/assets/models/ggml-tiny.en.bin

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandiAudioCaptureTest-v6-Whisper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
