name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Vosk English model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk-model
          mv /tmp/vosk-model/vosk-model-small-en-us-0.15 \
             app/src/main/assets/model-en-us
          printf 'bandi-en-us-small-0.15-v1\n' > app/src/main/assets/model-en-us/uuid
          test -s app/src/main/assets/model-en-us/uuid

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandiAudioCaptureTest-v5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
